<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1F"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="30%" stop-color="#22D3EE"/>
      <stop offset="70%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" rx="10" fill="url(#bg)"/>

  <!-- Decorative dots top-left -->
  <circle cx="30" cy="30" r="3" fill="#22D3EE" opacity="0.4"/>
  <circle cx="50" cy="22" r="2" fill="#A78BFA" opacity="0.3"/>
  <circle cx="20" cy="50" r="2" fill="#22D3EE" opacity="0.2"/>

  <!-- Decorative dots bottom-right -->
  <circle cx="870" cy="130" r="3" fill="#A78BFA" opacity="0.4"/>
  <circle cx="850" cy="140" r="2" fill="#22D3EE" opacity="0.3"/>
  <circle cx="880" cy="115" r="2" fill="#A78BFA" opacity="0.2"/>

  <!-- Accent line top -->
  <rect x="100" y="18" width="700" height="1" fill="url(#line)" opacity="0.5"/>

  <!-- Terminal prefix -->
  <text x="60" y="72" font-family="JetBrains Mono, monospace" font-size="13" fill="#22D3EE" opacity="0.7">~/vikash $</text>

  <!-- Name -->
  <text x="60" y="105" font-family="JetBrains Mono, monospace" font-size="36" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Vikash Kumar</text>

  <!-- Role -->
  <text x="62" y="132" font-family="JetBrains Mono, monospace" font-size="14" fill="#22D3EE" letter-spacing="1">.NET Backend Developer  ·  C#  ·  Azure  ·  SQL Server</text>

  <!-- Accent line bottom -->
  <rect x="100" y="148" width="700" height="1" fill="url(#line)" opacity="0.5"/>

  <!-- Cursor blink -->
  <rect x="490" y="89" width="3" height="22" fill="#22D3EE" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>